server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the file if it exists, otherwise fall back to index.html
    # so client-side routing doesn't 404 on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html itself is not
    # cached long since it references hashed asset filenames.
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
