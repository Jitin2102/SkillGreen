name: Database backup
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_MAJOR: '16'
    steps:
      - uses: actions/checkout@v4

      - name: Dump and encrypt
        id: dump
        env:
          DATABASE_URL: ${{ secrets['DATABASE_URL'] }}
          BACKUP_PASSPHRASE: ${{ secrets['BACKUP_PASSPHRASE'] }}
        run: |
          set -euo pipefail
          export PG_DUMP="docker run --rm -i -e PGSSLMODE=require postgres:${PG_MAJOR}-alpine pg_dump"
          file=$(bash scripts/backup.sh backups)
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Verify the backup can be decrypted and read
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          export PG_RESTORE="docker run --rm -i postgres:${PG_MAJOR}-alpine pg_restore"
          bash scripts/restore.sh verify "${{ steps.dump.outputs.file }}"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: skillgreen-db-backup
          path: backups/*.dump.enc
          retention-days: 14
          if-no-files-found: error
